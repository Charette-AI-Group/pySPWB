[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spwb"
version = "1.0.0"
description = "Signal Processing Work Bench - a DSP library and desktop application for spectra, transfer functions, spectrograms and adaptive filtering"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Charette AI Group" }]
requires-python = ">=3.10"
keywords = ["signal processing", "dsp", "fft", "spectrum", "spectrogram",
            "transfer function", "coherence", "vibration", "acoustics",
            "tdms", "labview", "rpc3", "nastran", "head acoustics",
            "artemis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    # Pure Python: one py3-none-any wheel serves Windows, macOS and Linux,
    # and the CI matrix runs the GUI on all three. Saying so on the project
    # page matters to the people deciding whether it will run on their Mac.
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    # the versions requires-python allows and the CI matrix actually
    # runs; PyPI uses these for its version filter
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
io = ["h5py>=3.8", "nptdms>=1.7"]
# The application is file-driven: without the IO extra it could not open
# HDF5, its own native format, and "pip install spwb[gui]" would produce a
# program whose first File > Open fails. The library is different - it is
# genuinely useful on arrays already in memory - so the core stays lean and
# only the application insists on the readers.
gui = ["PySide6>=6.5", "pyqtgraph>=0.13", "spwb[io]"]
# RPC-III, Nastran punch and HEAD acoustics HDF need nothing beyond numpy.
dev = [
    "pytest>=7",
    "ruff>=0.5",
    "PySide6>=6.5",
    "pyqtgraph>=0.13",
    "nptdms>=1.7",
    "matplotlib>=3.7",   # examples/ only
]
# Building the rendered notebooks that ship beside the user manuals, with
# tools/make_example_notebooks.py. Maintainers only: the example scripts
# themselves run with matplotlib alone, and tests/test_examples.py exercises
# them that way, so nothing here is needed to check the documentation holds.
docs = [
    "jupytext>=1.16",
    "nbclient>=0.9",
    "nbformat>=5.9",
    "ipykernel>=6.25",
    "matplotlib>=3.7",
]

[project.scripts]
spwb = "spwb.cli:main"

[project.urls]
Homepage = "https://github.com/Charette-AI-Group/pySPWB"
"Original LabVIEW application" = "https://github.com/Charette-AI-Group/SPWB"
Issues = "https://github.com/Charette-AI-Group/pySPWB/issues"

[tool.setuptools.packages.find]
where = ["src"]

# Anything dropped into src/spwb/resources (an application icon, say) ships
# in the wheel. Without this the file works from a source checkout and is
# silently missing from an installed copy.
[tool.setuptools.package-data]
spwb = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # tests/test_examples.py runs the documentation examples end to end,
    # generating the demo datasets first if they are missing. Deselect with
    # -m "not slow" for a quick loop.
    "slow: takes seconds rather than milliseconds",
]

[tool.ruff]
line-length = 88
target-version = "py310"
# Generated by tools/make_example_notebooks.py from examples/manuals/*.py,
# which ruff already checks. Linting the build output only means a stale
# notebook reports errors against its own source.
extend-exclude = ["docs/manuals/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    # `int(round(x))` -> `round(x)`. Only safe when x is a Python float;
    # this package supports numpy >= 1.24, where round() on a numpy scalar
    # did not reliably return an int. The explicit cast also documents that
    # the result is used as an index or a count.
    "RUF046",
]

[tool.ruff.lint.per-file-ignores]
# The tools/ scripts are operator scripts, not library code: they drive
# LabVIEW over COM (any call can raise, so catching broadly and reporting
# is the point) and they are full of absolute Windows vi.lib paths that
# cannot be usefully wrapped.
"tools/*" = ["B904", "S110", "E501", "E701", "E702", "E402"]
# Test modules set QT_QPA_PLATFORM before importing Qt, so their imports
# are deliberately not at the top of the file.
"tests/*" = ["E402"]
"examples/*" = ["E402"]
# The manual companions are notebooks in percent format: their markdown
# cells are ordinary comments to ruff, and those carry links into the
# manuals whose URLs cannot be wrapped without breaking the markdown.
"examples/manuals/*" = ["E402", "E501"]
